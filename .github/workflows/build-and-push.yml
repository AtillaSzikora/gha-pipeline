name: Build and Push to ECR
on:
  push:
    branches: [main]
    paths: [src/**]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: --Checkout--
        uses: actions/checkout@v7

      - name: --Set up Python--
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: --Set up UV--
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.11.0"
          enable-cache: true

      - name: --Install dependencies--
        run: uv sync --locked
        working-directory: src

      - name: --Configure AWS--
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN}}
          aws-region: ${{ vars.AWS_REGION }}

      - name: --Login to ECR--
        uses: aws-actions/amazon-ecr-login@v2

      - name: --Build image--
        run: |
          docker build --tag py-app:latest src
          
      - name: --Tag image--
        run: |
          docker tag py-app:latest "${{ vars.AWS_REPO_URI }}:${{ github.sha }}"

      - name: --Push image--
        run: |
          docker push "${{ vars.AWS_REPO_URI }}:${{ github.sha }}"

